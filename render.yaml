services:
  - type: web
    name: meta-lead-ads-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: VERIFY_TOKEN
        value: meta_dev_verify_token_123
      - key: APP_SECRET
        value: test_app_secret_abc123
      - key: PAGE_ACCESS_TOKEN
        value: test_page_access_token_xyz789
